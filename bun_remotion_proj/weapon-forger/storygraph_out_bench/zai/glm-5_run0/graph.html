:"等一下。 | 讓我看看這個年輕人的作品。 | 這把飛劍......三個微型隱藏機關、指紋識別陣法、自動格式化模組...... | 你是說，這把劍會自己找目標、自己鎖定、還有防盜系統？ | 有意思......非常有意思。 | 周墨，你為什麼要給飛劍裝自動格式化？ | ......手機是什麼？ | 你的腦袋裡裝的都是什麼亂七八糟的。 | 你說得對。他的方式確實......不合常規。 | 但是，這恰恰是我們煉器峰最需要的。 | 三百年来，我們煉器峰的法寶設計越來越保守。大家都只知道照著古方煉，沒有人敢創新。 | 這個年輕人雖然方法奇怪，但他的思路......是我見過最新穎的。 | 周墨，恭喜你。你通過了入宗考試。 | 考官，你是不是還想讓他把飛劍收回來？ | 你看，這就說明他的防盜系統做得很好。連他自己都收不回來。"}},{"id":"ch1ep2_char_narrator","label":"旁白 (ch1ep2)","community":8,"community_name":"Characters: 旁白 (ch1ep1), 旁白 (ch1ep2), 旁白 (ch1ep3), 旁白 (ch2ep1)","community_cohesion":1,"is_bridge":true,"is_god":false,"is_isolated":false,"source_file":"","file_type":"character_instance","episode":"ch1ep2","degree":15,"size":25,"font_size":12,"properties":{"character_id":"narrator","dialog_count":"5","dialog_text":"歡迎來到誰讓他煉器的！第一章，成績公布。 | 上一集，周墨的飛劍搶了考官的儲物袋。這一集，考官終於要公布成績了。周墨到底是被認可，還是被趕出去？答案可能出乎意料。 | 感謝收看誰讓他煉器的！第一章第二集，成績公布。 | 周墨以他獨特的煉器理念，獲得了煉器峰長老的認可。但考官的儲物袋......至今還沒拿回來。 | 下集預告：周墨正式加入煉器峰，他的第一個任務居然是——修丹爐。而且這個丹爐，會說話。","role":"structural"}},{"id":"ch1ep2_tech_演算法","label":"演算法","community":1,"community_name":"Story: ch1ep2","community_cohesion":0.1038961038961039,"is_bridge":false,"is_god":false,"is_isolated":false,"source_file":"","file_type":"tech_term","episode":"ch1ep2","degree":1,"size":11,"font_size":0,"properties":{}},{"id":"ch1ep2_tech_算法","label":"算法","community":1,"community_name":"Story: ch1ep2","community_cohesion":0.1038961038961039,"is_bridge":false,"is_god":false,"is_isolated":false,"source_file":"","file_type":"tech_term","episode":"ch1ep2","degree":1,"size":11,"font_size":0,"properties":{}},{"id":"ch1ep2_tech_使用者體驗","label":"使用者體驗","community":1,"community_name":"Story: ch1ep2","community_cohesion":0.1038961038961039,"is_bridge":false,"is_god":false,"is_isolated":false,"source_file":"","file_type":"tech_term","episode":"ch1ep2","degree":1,"size":11,"font_size":0,"properties":{}},{"id":"ch1ep2_tech_底層邏輯閉環","label":"底層邏輯閉環","community":1,"community_name":"Story: ch1ep2","community_cohesion":0.1038961038961039,"is_br ","file_type":"character_trait","episode":"ch1ep2","degree":1,"size":11,"font_size":0,"properties":{"character_id":"elder"}},{"id":"ch1ep2_trait_elder_認可但擔憂","label":"長老: 認可但擔憂","community":1,"community_name":"Story: ch1ep2","community_cohesion":0.1038961038961039,"is_bridge":false,"is_god":false,"is_isolated":false,"source_file":"","file_type":"character_trait","episode":"ch1ep2","degree":1,"size":11,"font_size":0,"properties":{"character_id":"elder"}},{"id":"ch1ep3_plot","label":"丹爐修復 (ch1ep3)","community":5,"community_name":"Story: ch1ep3","community_cohesion":0.11578947368421053,"is_bridge":true,"is_god":false,"is_isolated":false,"source_file":"","file_type":"episode_plot","episode":"ch1ep3","degree":12,"size":22,"font_size":12,"properties":{"language":"zh-TW"}},{"id":"ch1ep3_scene_TitleScene","label":"TitleScene","community":5,"community_name":"Story: ch1ep3","community_cohesion":0.11578947368421053,"is_bridge":false,"is_god":false,"is_isolated":false,"source_file":"","file_type":"scene","episode":"ch1ep3","degree":1,"size":11,"font_size":0,"properties":{"dialog_line_count":"2","character_count":"1","effect_count":"0"}},{"id":"ch1ep3_scene_ContentScene1","label":"ContentScene1","community":5,"community_name":"Story: ch1ep3","community_cohesion":0.11578947368421053,"is_bridge":false,"is_god":false,"is_isolated":false,"source_file":"","file_type":"scene","episode":"ch1ep3","degree":1,"size":11,"font_size":0,"properties":{"dialog_line_count":"14","character_count":"2","effect_count":"0"}},{"id":"ch1ep3_scene_ContentScene2","label":"ContentScene2","community":5,"community_name":"Story: ch1ep3","community_cohesion":0.11578947368421053,"is_bridge":false,"is_god":false,"is_isolated":false,"source_file":"","file_type":"scene","episode":"ch1ep3","degree":1,"size":11,"font_size":0,"properties":{"dialog_line_count":"13","character_count":"2","effect_count":"0"}},{"id":"ch1ep3_scene_OutroScene","label":"OutroScene","community":5,"community_name":"Story: ch1ep3","community_cohesion":0.11578947368421053,"is_bridge":false,"is_god":false,"is_isolated":false,"source_file":"","file_type":"scene","episode":"ch1ep3","degree":1,"size":11,"font_size":0,"properties":{"dialog_line_count":"3","character_count":"1","effect_count":"0"}},{"id":"ch1ep3_char_zhoumo","label":"周墨 (ch1ep3)","community":5,"community_name":"Story: ch1ep3","community_cohesion":0.11578947368421053,"is_bridge":true,"is_god":true,"is_isolated":false,"source_file":"","file_type":"character_instance","episode":"ch1ep3","degree":28,"size":38,"font_size":12,"properties":{"character_id":"zhoumo","dialog_count":"14","dialog_text":"謝謝長老！請問我的第一個任務是什麼？ | 修丹爐？聽起來很簡單。 | 丹爐......罵人？ | 有意思。技術上來說，一個有意識的丹爐，這是一個高級智能終端。 | 沒什麼。帶我去看看吧。 | 嗯......火焰陣法老化、溫控模組失靈、意識晶片過載。所以您生氣是因為沒有人維護您，對吧？ | 問題的核心是使用者體驗。這座丹爐不是壞了，它是被忽視了三百年。 | 好了，我來幫您做一個全面的系統升級。火焰陣法重寫、自動控溫模組、還有——情緒管理系統。 | 準確地說，是情感交互界面。它生氣是因為沒有人聽它說話，所以我裝了一個傾聽模組。 | 這只是其中一個功能。我還加了語音控制。現在只需要說一聲「請幫忙燒一下」就自動點火了。 | 哦，那是音樂播放功能。我覺得丹爐工作時也需要娛樂，不然多無聊。 | 當然。使用者體驗是產品設計的核心。 | 不會。我加了定時休眠功能，它晚上會自動安靜下來。 | 嗯......不過我忘加音量控制了。"}},{"id":"ch1ep3_char_elder","label":"長老 (ch1ep3)","community":5,"community_name":"Story: ch1ep3","community_cohesion":0.11578947368421053,"is_bridge":true,"is_god":false,"is_isolated":false,"source_file":"","file_type":"character_instance","episode":"ch1ep3","degree":13,"size":23,"font_size":12,"properties":{"character_id":"elder","dialog_count":"13","dialog_text":"周墨，歡迎加入煉器峰。從今天起，你就是正式弟子了。 | 修丹爐。 | 不簡單。這座丹爐有三百年歷史，上一位負責修理的弟子，被它罵哭了。 | 它會說話。而且說的都是髒話。昨天它還在罵我們煉器峰的人連火都不會點。 | 你在說什麼？ | 到了，就是這座。你小心點，它最近心情不好。 | 它好像......安靜了？ | 情緒管理系統？你要給丹爐做心理諮詢？ | 所以你修丹爐的方式是......陪它聊天？ | 倒是方便。不過......為什麼它在唱歌？ | 你連丹爐的使用者體驗都考慮到了？ | 好吧......不過它會不會在半夜自動開派對？ | 不錯不錯。看來你終於記得加停止鍵了。"}},{"id":"ch1ep3_char_narrator","label":"旁白 (ch1ep3)","community":8,"community_name":"Characters: 旁白 (ch1ep1), 旁白 (ch1ep2), 旁白 (ch1ep3), 旁白 (ch2ep1)","community_cohesion":1,"is_bridge":true,"is_god":false,"is_isolated":false,"source_file":"","file_type":"character_instance","episode":"ch1ep3","degree":15,"size":25,"font_size":12,"properties":{"character_id":"narrator","dialog_count":"5","dialog_text":"歡迎來到誰讓他煉器的！第一章，第三集，丹爐修復。 | 周墨正式加入煉器峰。長老交給他第一個任務：修復一座三百年歷史的丹爐。聽說這座丹爐有個小毛病——它會自己說話。而且脾氣比長老還大。 | 感謝收看誰讓他煉器的！第一章第三集，丹爐修復。 | 周墨用他獨特的方式修好了會說話的丹爐。雖然這座丹爐現在會在半夜唱歌，但至少它不罵人了。周墨似乎有一種天賦——他總是忘記加最重要的那個按鈕。 | 下一章預告：周墨在煉器峰的日子剛開始，但他即將遇到兩個比他還不正常的人。問道宗禍害三人組，即將成軍。","role":"structural"}},{"id":"ch1ep3_tech_使用者體驗","label":"使用者體驗","community":5,"community_name":"Story: ch1ep3","community_cohesion":0.11578947368421053,"is_bridge":false,"is_god":false,"is_isolated":false,"source_file":"","file_type":"tech_term","episode":"ch1ep3","degree":2,"size":12,"font_size":0,"properties":{}},{"id":"ch1ep3_tech_系統升級","label":"系統升級","community":5,"community_name":"Story: ch1ep3","community_cohesion":0.11578947368421053,"is_bridge":false,"is_god":false,"is_isolated":false,"source_file":"","file_type":"tech_term","episode":"ch1ep3","degree":1,"size":11,"font_size":0,"properties":{}},{"id":"ch1ep3_tech_情緒管理系統","label":"情緒管理系統","community":5,"community_name":"Story: ch1ep3","community_cohesion":0.11578947368421053,"is_bridge":false,"is_god":false,"is_isolated":false,"source_file":"","file_type":"tech_term","episode":"ch1ep3","degree":2,"size":12,"font_size":0,"properties":{}},{"id":"ch1ep3_tech_情感交互界面","label":"情感交互界面","community":5,"community_name":"Story: ch1ep3","community_cohesion":0.11578947368421053,"is_bridge":false,"is_god":false,"is_isolated":false,"source_file":"","file_type":"tech_term","episode":"ch1ep3","degree":1,"size":11,"font_size":0,"properties":{}},{"id":"ch1ep3_tech_語音控制","label":"語音控制","community":5,"community_name":"Story: ch1ep3","community_cohesion":0.11578947368421053,"is_bridge":false,"is_god":false,"is_isolated":false,"source_file":"","file_type":"tech_term","episode":"ch1ep3","degree":1,"size":11,"font_size":0,"properties":{}},{"id":"ch1ep3_tech_定時休眠","label":"定時休眠","community":5,"community_name":"Story: ch1ep3","community_cohesion":0.11578947368421053,"is_bridge":false,"is_god":false," :false,"is_isolated":false,"source_file":"","file_type":"scene","episode":"ch2ep1","degree":1,"size":11,"font_size":0,"properties":{"dialog_line_count":"2","character_count":"1","effect_count":"2"}},{"id":"ch2ep1_scene_ContentScene1","label":"ContentScene1","community":6,"community_name":"Story: ch2ep1","community_cohesion":0.11578947368421053,"is_bridge":false,"is_god":false,"is_isolated":false,"source_file":"","file_type":"scene","episode":"ch2ep1","degree":1,"size":11,"font_size":0,"properties":{"dialog_line_count":"11","character_count":"2","effect_count":"1"}},{"id":"ch2ep1_scene_ContentScene2","label":"ContentScene2","community":6,"community_name":"Story: ch2ep1","community_cohesion":0.11578947368421053,"is_bridge":false,"is_god":false,"is_isolated":false,"source_file":"","file_type":"scene","episode":"ch2ep1","degree":1,"size":11,"font_size":0,"properties":{"dialog_line_count":"21","character_count":"3","effect_count":"1"}},{"id":"ch2ep1_scene_OutroScene","label":"OutroScene","community":6,"community_name":"Story: ch2ep1","community_cohesion":0.11578947368421053,"is_bridge":false,"is_god":false,"is_isolated":false,"source_file":"","file_type":"scene","episode":"ch2ep1","degree":1,"size":11,"font_size":0,"properties":{"dialog_line_count":"3","character_count":"1","effect_count":"0"}},{"id":"ch2ep1_char_zhoumo","label":"周墨 (ch2ep1)","community":6,"community_name":"Story: ch2ep1","community_cohesion":0.11578947368421053,"is_bridge":true,"is_god":true,"is_isolated":false,"source_file":"","file_type":"character_instance","episode":"ch2ep1","degree":25,"size":35,"font_size":12,"properties":{"character_id":"zhoumo","dialog_count":"13","dialog_text":"新的實驗！這次我改良了壓力釋放模組。理論上，效率應該提高百分之三百。 | 三、二、一——啟動！ | 什麼？ | 你的劍法叫投降劍法？ | 從邏輯上來說，確實是最短路徑。你直接跳過了戰鬥過程，抵達了終點。 | 不不不，你是把「效率」做到了極致。這是一種高級演算法思維。 | 這也是天賦？ | 你把單身當成一個研究課題？ | 我突然覺得，我們三個有一個共同點。 | 我們都不正常。 | 所以我提議，我們成立一個小組。叫「問道宗邏輯修正小組」。 | 修正整個修仙界對「正常」的定義。 | 成交。順帶一提，我剛才忘了說——第三個鍋爐的爆炸範圍可能還沒結束。"}},{"id":"ch2ep1_char_luyang","label":"陸陽 (ch2ep1)","community":6,"community_name":"Story: ch2ep1","community_cohesion":0.11578947368421053,"is_bridge":true,"is_god":false,"is_isolated":false,"source_file":"","file_type":"character_instance","episode":"ch2ep1","degree":15,"size":25,"font_size":12,"properties":{"character_id":"luyang","dialog_count":"11","dialog_text":"那個，不好意思打擾了，請問你們這裡有沒有投降表？ | 我是問道宗新弟子陸陽，我的劍法叫「投降劍法」。剛才看到爆炸，想說先填好表，等一下可能用得上。 | 對啊！核心招式是「我認輸」和「別打了」。防守效率極高——因為對手通常笑到沒力氣繼續打。 | 對吧！終於有人理解我了！其他人只會說我沒出息。 | 你，你是唯一一個說我好話的人。 | 這位是？ | 那你研究什麼？ | 什麼？ | 說得好有道理。 | 我加入！不過我有一個條件——小組的第一條規則是「隨時可以投降」。 | 我的投降表呢？"}},{"id":"ch2ep1_char_mengjingzhou","label":"孟景舟 (ch2ep1)","community":6,"community_name":"Story: ch2ep1","community_cohesion":0.11578947368421053,"is_bridge":true,"is_god":false,"is_isolated":false,"source_file":"","file_type":"character_instance","episode":"ch2ep1","degree":17,"size":27,"font_size":12,"properties":{"character_id":"mengjingzhou","dialog_count":"8","dialog_text":"等等，你們兩個在聊什麼？我從二十步外就感覺到了異常的邏輯波動。 | 孟景舟，問道宗弟子。我的天賦是「單身光環」——方圓三丈內，所有女性都會自動遠離我。 | 宗門鑒定說是「被動技能，無法關閉」。連女修都繞著我走，所以我有很充足的時間做研究。 | 為什麼我沒有女朋友。 | 二十三年了。我的論文已經寫到第七篇了，題目是「論問道宗女弟子的空間分布與我的絕緣性」。 | 什麼？ | 邏輯修正？修正什麼？ | 我也有條件——開會的時候不要提「女朋友」這三個字。"}},{"id":"ch2ep1_char_narrator","label":"旁白 (ch2ep1)","community":8,"community_name":"Characters: 旁白 (ch1ep1), 旁白 (ch1ep2), 旁白 (ch1ep3), 旁白 (ch2ep1)","community_cohesion":1,"is_bridge":true,"is_god":false,"is_isolated":false,"source_file":"","file_type":"character_instance","episode":"ch2ep1","degree":15,"size":25,"font_size":12,"properties":{"character_id":"narrator","dialog_count":"5","dialog_text":"歡迎來到誰讓他煉器的！第二章，第一集，禍害成軍。 | 周墨在煉器峰的日子過得「精彩」——丹爐半夜唱歌、鍋爐接連爆炸、長老的頭髮越來越少。今天，他即將炸掉第三個鍋爐。但這一次，爆炸的範圍比預期大了一點。 | 感謝收看誰讓他煉器的！第二章第一集，禍害成軍。 | 問道宗邏輯修正小組正式成立。三個最不正常的弟子聚在一起，展開了全新的篇章。陸陽的投降劍法、孟景舟的單身研究、周墨的法寶實驗——問道宗從此再也沒有安寧的日子。 | 下集預告：三人組的第一個共同任務——探索後山的「低語洞窟」。聽說那裡住著一個上古大能的殘魂，但周墨覺得那只是一個「待修復的離線終端」。","role":"structural"}},{"id":"ch2ep1_tech_壓力釋放模組","label":"壓力釋放模組","community":6,"community_name":"Story: ch2ep1","community_cohesion":0.11578 is_god":false,"is_isolated":false,"source_file":"","file_type":"scene","episode":"ch2ep2","degree":1,"size":11,"font_size":0,"properties":{"dialog_line_count":"11","character_count":"4","effect_count":"0"}},{"id":"ch2ep2_scene_OutroScene","label":"OutroScene","community":0,"community_name":"Story: ch2ep2","community_cohesion":0.10507246376811594,"is_bridge":false,"is_god":false,"is_isolated":false,"source_file":"","file_type":"scene","episode":"ch2ep2","degree":1,"size":11,"font_size":0,"properties":{"dialog_line_count":"3","character_count":"1","effect_count":"0"}},{"id":"ch2ep2_char_zhoumo","label":"周墨 (ch2ep2)","community":0,"community_name":"Story: ch2ep2","community_cohesion":0.10507246376811594,"is_bridge":true,"is_god":true,"is_isolated":false,"source_file":"","file_type":"character_instance","episode":"ch2ep2","degree":28,"size":38,"font_size":12,"properties":{"character_id":"zhoumo","dialog_count":"9","dialog_text":"邏輯修正小組，第一次正式任務——低語洞窟探索。 | 先進去再說。這個洞窟的結構很有規律，像是某種陣法構建的空間。 | 有意思。一個語音觸發的自動防禦系統。讓我看看能不能重設密碼。 | 找到了。能量核心有裂痕，記憶區段損壞。他只能重複同一句話。 | 更精確地說，是「靈魂驅動的自動防禦系統」。我來修復他。 | 當然。這只是常規維護。修好了，以後別再大喊大叫。 | 忘加位置標記是普遍性問題。不過至少他不再重複那句話了。 | 有意思。那把劍被列為宗門至寶，但沒有人能拔出來。 | 原來忘加按鈕是家族遺傳。"}},{"id":"ch2ep2_char_luyang","label":"陸陽 (ch2ep2)","community":0,"community_name":"Story: ch2ep2","community_cohesion":0.10507246376811594,"is_bridge":true,"is_god":false,"is_isolated":false,"source_file":"","file_type":"character_instance","episode":"ch2ep2","degree":17,"size":27,"font_size":12,"properties":{"character_id":"luyang","dialog_count":"3","dialog_text":"我帶了投降表。三份。 | 對不起對不起對不起！我投降！ | 三千年前的長老也忘東西？"}},{"id":"ch2ep2_char_mengjingzhou","label":"孟景舟 (ch2ep2)","community":0,"community_name":"Story: ch2ep2","community_cohesion":0.10507246376811594,"is_bridge":true,"is_god":true,"is_isolated":false,"source_file":"","file_type":"character_instance","episode":"ch2ep2","degree":19,"size":29,"font_size":12,"properties":{"character_id":"mengjingzhou","dialog_count":"3","dialog_text":"我帶了研究筆記。如果洞窟裡有女性殘魂，我要記錄單身光環的有效範圍。 | 所以這個上古劍仙其實是一個記憶體壞掉的人工智慧？ | 等一下，他煉的那把劍——煉器峰傳說中的「滄溟之劍」不會就是吧？"}},{"id":"ch2ep2_char_soul","label":"滄溟子 (ch2ep2)","community":0,"community_name":"Story: ch2ep2","community_cohesion":0.10507246376811594,"is_bridge":false,"is_god":false,"is_isolated":false,"source_file":"","file_type":"character_instance","episode":"ch2ep2","degree":9,"size":19,"font_size":12,"properties":{"character_id":"soul","dialog_count":"5","dialog_text":"吾乃上古劍仙——滄溟子！誰敢闖入吾之領地！ | 你說什麼？！吾乃—— | 你——你要修復吾？三千年来，你是第一個不逃跑的人。 | 吾想起了……吾是滄溟子，問道宗第三代長老。吾把畢生修為煉成了一把劍——但是忘記放哪了。 | 吾知道原因。吾當年……忘記加拔劍按鈕了。"}},{"id":"ch2ep2_char_narrator","label":"旁白 (ch2ep2)","community":8,"community_name":"Characters: 旁白 (ch1ep1), 旁白 (ch1ep2), 旁白 (ch1ep3), 旁白 (ch2ep1)","community_cohesion":1,"is_bridge":true,"is_god":false,"is_isolated":false,"source_file":"","file_type":"character_instance","episode":"ch2ep2","degree":15,"size":25,"font_size":12,"properties":{"character_id":"narrator","dialog_count":"5","dialog_text":"歡迎來到誰讓他煉器的！第二章，第二集，低語洞窟。 | 邏輯修正小組成立後的第一個任務——探索後山的低語洞窟。聽說那裡住著一個上古大能的殘魂，已經嚇跑了十七批弟子。但周墨認為，這只是一個「待修復的離線終端」。 | 感謝收看誰讓他煉器的！第二章第二集，低語洞窟。 | 邏輯修正小組的第一個任務圓滿完成——殘魂被修好了，但那把「忘加拔劍按鈕」的滄溟之劍還在等著有人來拔。周墨已經在研究那個按鈕該怎麼加了。 | 下集預告：低語洞窟的事傳開了，長老派邏輯修正小組參加宗門秘境探索。別的宗門在破解上古禁制，周墨掏出了「雷射切割陣法」。長老說：「這不是禁制破解工具！」「但效率很高。」","role":"structural"}},{"id":"ch2ep2_tech_自動防禦系統","label":"自動防禦系統","community":0,"community_name":"Story: ch2ep2","community_cohesion":0.10507246376811594,"is_bridge":false,"is_god":false,"is_isolated":false,"source_file":"","file_type":"tech_term","episode":"ch2ep2","degree":1,"size":11,"font_size":0,"properties":{}},{"id":"ch2ep2_tech_記憶區段","label":"記憶區段","community":0,"community_name":"Story: ch2ep2","community_cohesion":0.10507246376811594,"is_bridge":false,"is_god":false,"is_isolated":false,"source_file":"","file_type":"tech_term","episode":"ch2ep2","degree":1,"size":11,"font_size":0,"properties":{}},{"id":"ch2ep2_tech_常規維護","label":"常規維護","community":0,"community_name":"Story: ch2ep2","community_cohesion":0.1050724 community":2,"community_name":"Story: ch2ep3","community_cohesion":0.12121212121212122,"is_bridge":false,"is_god":false,"is_isolated":false,"source_file":"","file_type":"scene","episode":"ch2ep3","degree":1,"size":11,"font_size":0,"properties":{"dialog_line_count":"11","character_count":"5","effect_count":"0"}},{"id":"ch2ep3_scene_ContentScene2","label":"ContentScene2","community":2,"community_name":"Story: ch2ep3","community_cohesion":0.12121212121212122,"is_bridge":false,"is_god":false,"is_isolated":false,"source_file":"","file_type":"scene","episode":"ch2ep3","degree":1,"size":11,"font_size":0,"properties":{"dialog_line_count":"20","character_count":"4","effect_count":"0"}},{"id":"ch2ep3_scene_OutroScene","label":"OutroScene","community":2,"community_name":"Story: ch2ep3","community_cohesion":0.12121212121212122,"is_bridge":false,"is_god":false,"is_isolated":false,"source_file":"","file_type":"scene","episode":"ch2ep3","degree":1,"size":11,"font_size":0,"properties":{"dialog_line_count":"3","character_count":"1","effect_count":"0"}},{"id":"ch2ep3_char_zhoumo","label":"周墨 (ch2ep3)","community":2,"community_name":"Story: ch2ep3","community_cohesion":0.12121212121212122,"is_bridge":true,"is_god":true,"is_isolated":false,"source_file":"","file_type":"character_instance","episode":"ch2ep3","degree":30,"size":40,"font_size":12,"properties":{"character_id":"zhoumo","dialog_count":"8","dialog_text":"藏經閣。三百年沒人維護的資訊系統。典型的「缺乏使用者回饋導致系統退化」。我對這個任務很有興趣。 | 放心，長老。我只是去做系統維護。 | 有趣。這些書的攻擊行為，本質上是「尋求關注」。三百年沒有人閱讀它們，它們的防禦機制是對「被忽視」的反應。 | 從工程學的角度來說，這是一個「缺乏正向回饋的系統」。解決方案很簡單——給它們「點讚」。 | 我給每本書加了一個「認可系統」。它們得到了三百年來第一個正向評價。問題解決。 | ……我來給它們加一個「自動評價系統」。 | 啊……我忘記加「評價標準」了。沒有標準的評價系統，就像沒有尺的裁縫—— | ……我本來想說「會亂剪一氣」，但你的比喻更好。"}},{"id":"ch2ep3_char_luyang","label":"陸陽 (ch2ep3)","community":2,"community_name":"Story: ch2ep3","community_cohesion":0.12121212121212122,"is_bridge":true,"is_god":false,"is_isolated":false,"source_file":"","file_type":"character_instance","episode":"ch2ep3","degree":17,"size":27,"font_size":12,"properties":{"character_id":"luyang","dialog_count":"7","dialog_text":"長老，藏經閣為什麼會自己崩塌？ | 每次周墨說「放心」，我就開始擔心。 | 什麼——！ | 那是我的投降表！那是我精心設計的！裡面有十七種投降姿勢的插圖！ | 所以你的意思是……這些書在鬧脾氣？ | 但是周墨……藏經閣裡所有的書都在看著你。 | 會把衣服做成正方形。"}},{"id":"ch2ep3_char_mengjingzhou","label":"孟景舟 (ch2ep3)","community":2,"community_name":"Story: ch2ep3","community_cohesion":0.12121212121212122,"is_bridge":true,"is_god":false,"is_isolated":false,"source_file":"","file_type":"character_instance","episode":"ch2ep3","degree":17,"size":27,"font_size":12,"properties":{"character_id":"mengjingzhou","dialog_count":"5","dialog_text":"……書會有怨念？ | ……長老這句話比我的論文還殘忍。 | 等等……這本書在批改我的論文？它加了一行：「論點不成立，建議重寫」——還畫了一個大大的叉。 | 就……就這樣？ | 周墨，你的自動評價系統出了問題。這些書的文學水平直線下降——它們現在只會互相吹捧。"}},{"id":"ch2ep3_char_elder","label":"長老 (ch2ep3)","community":2,"community_name":"Story: ch2ep3","community_cohesion":0.12121212121212122,"is_bridge":true,"is_god":false,"is_isolated":false,"source_file":"","file_type":"character_instance","episode":"ch2ep3","degree":14,"size":24,"font_size":12,"properties":{"character_id":"elder","dialog_count":"4","dialog_text":"藏經閣三年前因為結構老化崩塌了。裡面的書籍至今沒有人整理。你們去修復一下。 | 三百年沒人去過。書的怨念太重，把建築震塌了。 | 你試試三百年沒有人翻開你寫的論文。 | 周墨，我警告你，不許把藏經閣改成什麼奇怪的東西。"}},{"id":"ch2ep3_char_narrator","label":"旁白 (ch2ep3)","community":8,"community_name":"Characters: 旁白 (ch1ep1), 旁白 (ch1ep2), 旁白 (ch1ep3), 旁白 (ch2ep1)","community_cohesion":1,"is_bridge":true,"is_god":false,"is_isolated":false,"source_file":"","file_type":"character_instance","episode":"ch2ep3","degree":15,"size":25,"font_size":12,"properties":{"character_id":"narrator","dialog_count":"12","dialog_text":"歡迎來到誰讓他煉器的！第二章，第三集，三人成虎。 | 低語洞窟任務完成後，滄溟子的殘魂正式成為邏輯修正小組的「名譽顧問」。長老派了第二個任務：修復後山崩塌的藏經閣。三百年沒有人去過的藏經閣，書的怨念太重，把建築都震塌了。 | 長老召集邏輯修正小組，說明了任務內容。 | 三人來到藏經閣廢墟。剛踏進門，一本書從空中飛來—— | 書本直接搶走了陸陽口袋裡的投降表，然後開始朗讀。 | 另一本書飛向孟景舟，搶走了他的論文草稿。幾秒後，書上多了一堆紅筆批改。 | 周墨掏出一個小裝置，對著每本書按了一下。書們立刻安靜了下來。 | 數百本書同時翻開，書頁發出沙沙聲，仿佛在說——「我的呢？」 | 三天後。藏經閣裡的書開始互相寫評論。一本《劍道入門》給自己打了五星，評語是「本世紀最偉大的著作」。旁邊的《煉丹基礎》不甘示弱，寫了一篇長文評論自己「超越了上古大能」。 | 感謝收看誰讓他煉器的！第二章第三集，三人成虎。 | 邏輯修正小組成功「修復」了藏經閣——雖然現在裡面的書都在互相吹捧，文學水平跌到了谷底。周墨的自動評價系統效率很高，但忘了加評價標準，導致藏經閣成了修仙界最大的「假評價工廠」。 | 下集預告：","role":"structural"}},{"id":"ch2ep3_tech_資訊系統","label":"資訊系統","community":2,"community_name":"Story: ch2ep3","community_cohesion":0.12121212121212122,"is_bridge":false,"is_god":false,"is_isolated":false,"source_file":"","file_type":"tech_term","episode":"ch2ep3","degree":1,"size":11,"font_size":0,"properties":{}},{"id":"ch2ep3_tech_認可系統","label":"認可系統","community":2,"community_name":"Story: ch2ep3","community_cohesion":0.12121212121212122,"is_bridge":false,"is_god":false,"is_isolated":false,"source_file":"","file_type":"tech_term","episode":"ch2ep3","degree":1,"size":11,"font_size":0,"properties":{}},{"id":"ch2ep3_tech_自動評價系統","label":"自動評價系統","community":2,"community_name":"Story: ch2ep3","community_cohesion":0.12121212121212122,"is_bridge":false,"is_god":false,"is_isolated":false,"source_file":"","file_type":"tech_term","episode":"ch2ep3","degree":2,"size":12,"font_size":0,"properties":{}},{"id":"ch2ep3_tech_評價標準","label":"評價標準","community":2,"community_name":"Story: ch2ep3","community_cohesion":0.12121212121212122,"is_bridge":false,"is_god":false,"is_isolated":false,"source_file":"","file_type":"tech_term","episode":"ch2ep3","degree":1,"size":11,"font_size":0,"properties":{}},{"id":"ch2ep3_gag_忘加按鈕","label":"忘加按鈕：忘加評價標準","community":9,"community_name":"Gags: 忘加按鈕","community_cohesion":0.2857142857142857,"is_bridge":true,"is_god":false,"is_isolated":false,"source_file":"","file_type":"gag_manifestation","episode":"ch2ep3","degree":3,"size":13,"font_size":0,"properties":{"gag_type":"忘加按鈕","episode":"ch2ep3"}},{"id":"ch2ep3_gag_現代科技用語","label":"現代科技用語：資訊系統、認可系統、自動評價系統","community":10,"community_name":"Gags: 現代科技用語","community_cohesion":0.2857142857142857,"is_bridge":true,"is_god":false,"is_isolated":false,"source_file":"","file_type":"gag_manifestation","episode":"ch2ep3","degree":3,"size":13,"font_size":0,"properties":{"gag_type":"現代科技用語","episode":"c rties":{"dialog_line_count":"2","character_count":"1","effect_count":"0"}},{"id":"ch3ep1_scene_ContentScene1","label":"ContentScene1","community":3,"community_name":"Story: ch3ep1","community_cohesion":0.12380952380952381,"is_bridge":false,"is_god":false,"is_isolated":false,"source_file":"","file_type":"scene","episode":"ch3ep1","degree":1,"size":11,"font_size":0,"properties":{"dialog_line_count":"11","character_count":"5","effect_count":"0"}},{"id":"ch3ep1_scene_ContentScene2","label":"ContentScene2","community":3,"community_name":"Story: ch3ep1","community_cohesion":0.12380952380952381,"is_bridge":false,"is_god":false,"is_isolated":false,"source_file":"","file_type":"scene","episode":"ch3ep1","degree":1,"size":11,"font_size":0,"properties":{"dialog_line_count":"16","character_count":"4","effect_count":"0"}},{"id":"ch3ep1_scene_OutroScene","label":"OutroScene","community":3,"community_name":"Story: ch3ep1","community_cohesion":0.12380952380952381,"is_bridge":false,"is_god":false,"is_isolated":false,"source_file":"","file_type":"scene","episode":"ch3ep1","degree":1,"size":11,"font_size":0,"properties":{"dialog_line_count":"3","character_count":"1","effect_count":"0"}},{"id":"ch3ep1_char_zhoumo","label":"周墨 (ch3ep1)","community":3,"community_name":"Story: ch3ep1","community_cohesion":0.12380952380952381,"is_bridge":true,"is_god":true,"is_isolated":false,"source_file":"","file_type":"character_instance","episode":"ch3ep1","degree":27,"size":37,"font_size":12,"properties":{"character_id":"zhoumo","dialog_count":"8","dialog_text":"長老，我準備了「雷射切割陣法」。根據古籍記載，這個秘境的禁制是三千年前的陣法構建，結構規律性很高，可以用線性切割的方式高效破解。 | 那是「聚焦式靈氣切割陣法發射器」。我簡稱它「雷射筆」。 | 這不是危險，這是效率。 | 閃開。 | 就這樣。三千年前的陣法結構是單層線性排列，沒有冗餘設計。一個工程師的基本常識：永遠不要信任沒有備份的系統。 | 嗯，雷射筆的切割範圍確實沒有設定邊界。我記得我加了方向控制……等等，我忘了加方向控制。 | 冷靜。這只是一個計時觸發的自動防禦協議。我來看看能不能找到……出口。 | ……這是一個需要優化的設計缺陷。"}},{"id":"ch3ep1_char_luyang","label":"陸陽 (ch3ep1)","community":3,"community_name":"Story: ch3ep1","community_cohesion":0.12380952380952381,"is_bridge":true,"is_god":true,"is_isolated":false,"source_file":"","file_type":"character_instance","episode":"ch3ep1","degree":18,"size":28,"font_size":12,"properties":{"character_id":"luyang","dialog_count":"5","dialog_text":"長老放心，我帶了五份投降表，涵蓋所有可能的宗門。 | 看起來確實像一支筆。一支會把東西切開的筆。 | 我在旁邊觀察了。他的臉越來越紅。我覺得他快要—— | 但是周墨……你好像把所有禁制都切斷了。不只是入口這個——整座秘境的禁制系統。 | 我的投降表能遞給上古大能的保護機制嗎？"}},{"id":"ch3ep1_char_mengjingzhou","label":"孟景舟 (ch3ep1)","community":3,"community_name":"Story: ch3ep1","community_cohesion":0.12380952380952381,"is_bridge":true,"is_god":true,"is_isolated":false,"source_file":"","file_type":"character_instance","episode":"ch3ep1","degree":18,"size":28,"font_size":12,"properties":{"character_id":"mengjingzhou","dialog_count":"6","dialog_text":"我帶了論文草稿——「秘境環境對單身光環的影響研究」。如果遇到女修，這是很好的數據採集機會。 | 記錄：周墨又造了一個危險的東西。這是第幾次了？ | 那個天劍宗的首席弟子已經砍了三十七劍了。禁制連個痕跡都沒有。 | ……就這樣？ | 一百八十息？那是我們能活多久的意思嗎？ | 出口也被你切斷了。你看，那個門已經變成兩半了。"}},{"id":"ch3ep1_char_elder","label":"長老 (ch3ep1)","community":3,"community_name":"Story: ch3ep1","community_cohesion":0.12380952380952381,"is_bridge":true,"is_god":false,"is_isolated":false,"source_file":"","file_type":"character_instance","episode":"ch3ep1","degree":13,"size":23,"font_size":12,"properties":{"character_id":"elder","dialog_count":"3","dialog_text":"這次秘境探索，你們三個給我安分點。別丟問道宗的臉。 | ……你們能不能有一次正常的準備？ | 你說的是那個……看起來像一根會發光的筷子一樣的東西？"}},{"id":"ch3ep1_char_narrator","label":"旁白 (ch3ep1)","community":8,"community_name":"Characters: 旁白 (ch1ep1), 旁白 (ch1ep2), 旁白 (ch1ep3), 旁白 (ch2ep1)","community_cohesion":1,"is_bridge":true,"is_god":false,"is_isolated":false,"source_file":"","file_type":"character_instance","episode":"ch3ep1","degree":15,"size":25,"font_size":12,"properties":{"character_id":"narrator","dialog_count":"10","dialog_text":"歡迎來到誰讓他煉器的！第三章，第一集，秘境探索。 | 低語洞窟的任務完成後，邏輯修正小組的名聲傳遍了問道宗——當然，是「禍害」那種名聲。長老決定把他們派去參加五年一次的宗門秘境探索，希望他們在別人面前丟臉。但周墨對這次任務充滿期待——因為秘境裡有大量上古陣法，簡直是工程師的天堂。 | 宗門秘境入口，五大宗門齊聚。各派精英弟子正在研究上古禁制的破解方法。 | 秘境內部。其他宗門的弟子們正在用各種方法破解禁制——有人用符咒，有人用劍氣，有人用陣盤。進度：零。 | 周墨按下雷射筆的按鈕。一道筆直的靈氣光束射出—— | 禁制。被切成了兩半。 | 整座秘境震動。牆壁上浮現出上古文字：「警告——禁制系統已離線——保護機制啟動——自毀倒數：一百八十息。」 | 感謝收看誰讓他煉器的！第三章第一集，秘境探索。 | 邏輯修正小組成功進入了秘境——然後成功觸發了自毀倒數。周墨的雷射筆效率很高，但忘了加方向限制，導致出口也被切斷了。現在問題很簡單：在一百八十息之內，找到一個不存在的出口。 | 下集預告：邏輯修正小組在自毀倒計時中瘋狂找出口，結果發現秘境的核心藏著一個更大的秘密——上古大能設計這個秘境的真正目的","role":"structural"}},{"id":"ch3ep1_tech_雷射切割","label":"雷射切割","community":3,"community_name":"Story: ch3ep1","community_cohesion":0.12380952380952381,"is_bridge":false,"is_god":false,"is_isolated":false,"source_file":"","file_type":"tech_term","episode":"ch3ep1","degree":1,"size":11,"font_size":0,"properties":{}},{"id":"ch3ep1_tech_冗餘設計","label":"冗餘設計","community":3,"community_name":"Story: ch3ep1","community_cohesion":0.12380952380952381,"is_bridge":false,"is_god":false,"is_isolated":false,"source_file":"","file_type":"tech_term","episode":"ch3ep1","degree":1,"size":11,"font_size":0,"properties":{}},{"id":"ch3ep1_tech_自動防禦協議","label":"自動防禦協議","community":3,"community_name":"Story: ch3ep1","community_cohesion":0.12380952380952381,"is_bridge":false,"is_god":false,"is_isolated":false,"source_file":"","file_type":"tech_term","episode":"ch3ep1","degree":1,"size":11,"font_size":0,"properties":{}},{"id":"ch3ep1_gag_忘加按鈕","label":"忘加按鈕：忘加方向控制","community":9,"community_name":"Gags: 忘加按鈕","community_cohesion":0.2857142857142857,"is_bridge":true,"is_god":false,"is_isolated":false,"source_file":"","file_type":"gag_manifestation","episode":"ch3ep1","degree":2,"size":12,"font_size":0,"properties":{"gag_type":"忘加按鈕","episode":"ch3ep1"}},{"id":"ch3ep1_gag_現代科技用語","label":"現代科技用語：雷射切割陣法、冗餘設計、備份系統","community":10,"community_name":"Gags: 現代科技用語","community_cohesion":0.2857142857142857,"is_bridge":true,"is_god":false,"is_isolated":false,"source_file":"","file_type":"gag_manifestation","episode":"ch3ep1","degree":2,"size":12,"font_size":0,"properties":{"gag_type":"現代科技用語","episode":"ch3ep1"}},{"id":"ch3ep1_gag_法寶反噬","label":"法寶反噬：雷射筆切了出口→自毀倒數","community":11,"community_name":"Gags: 法寶反噬","community_cohesion":0.2857142857142857,"is_bridge":true,"is_god":false,"is const HAS_CROSS_LINKS = false;

let colorMode = IS_MERGED ? 'episode' : 'type';

function nodeColor(n) {
  if (colorMode === 'episode') {
    return EPISODE_COLORS[n.episode] || DEFAULT_EP_COLOR;
  }
  if (colorMode === 'community') {
    return COMMUNITY_COLORS[n.community % COMMUNITY_COLORS.length];
  }
  return TYPE_COLORS[n.file_type] || '#BAB0AC';
}

// PageRank threshold: top 10% of nodes get glow effect
const prValues = Object.values(PAGE_RANK_SCORES).sort((a, b) => b - a);
const prThreshold = prValues.length > 0 ? prValues[Math.max(0, Math.floor(prValues.length * 0.1))] : 0;

const nodesDS = new vis.DataSet(RAW_NODES.map(n => {
  const c = nodeColor(n);
  const pr = PAGE_RANK_SCORES[n.id] || 0;
  const isHighPR = pr > 0 && pr >= prThreshold;
  return {
    id: n.id,
    label: n.label,
    color: { background: c, border: c, highlight: { background: '#fff', border: c } },
    size: n.size,
    font: { size: n.font_size, color: '#fff', face: 'system-ui, sans-serif', strokeWidth: 2, strokeColor: '#0f0f1a' },
    title: escapeHtml(n.label) + ' [' + n.file_type + ']' + (pr > 0 ? ' [PR: ' + pr.toFixed(3) + ']' : ''),
    _type: n.file_type,
    _episode: n.episode,
    _properties: n.properties || {},
    _community: n.community,
    _page_rank: pr,
    borderWidth: isHighPR ? 4 : 2,
    shadow: isHighPR ? { enabled: true, color: c, size: 15, x: 0, y: 0 } : { enabled: false },
  };
}));

const edgesDS = new vis.DataSet(RAW_EDGES.map((e, i) => {
  const base = {
    id: i, from: e.from, to: e.to, title: e.title,
    arrows: { to: { enabled: true, scaleFactor: 0.5 } },
    width: e.width,
    smooth: { type: 'curvedCW', roundness: 0.15 },
  };
  if (e.is_link) {
    const lc = LINK_EDGE_COLORS[e.link_relation] || '#FF6B6B';
    base.color = { opacity: e.color_opacity, color: lc };
    base.dashes = true;
  } else {
    base.color = { opacity: e.color_opacity, color: '#666' };
    base.dashes = false;
  }
  return base;
}));

// AI cross-link edges (dotted lines, separate from dashed link edges)
var crossLinkStartId = RAW_EDGES.length;
var crossLinkEdges = [];
for (var ci = 0; ci < RAW_CROSS_LINKS.length; ci++) {
  var ce = RAW_CROSS_LINKS[ci];
  var clc = AI_CROSS_LINK_COLORS[ce.link_type] || '#FF85A1';
  crossLinkEdges.push({
    id: crossLinkStartId + ci,
    from: ce.from, to: ce.to, title: ce.title,
    arrows: { to: { enabled: true, scaleFactor: 0.4 } },
    width: ce.width,
    smooth: { type: 'curvedCW', roundness: 0.25 },
    color: { opacity: ce.color_opacity, color: clc },
    dashes: ce.dashes,
    _is_cross_link: true,
    _cross_link_type: ce.link_type,
    _cross_link_confidence: ce.confidence,
    _cross_link_rationale: ce.rationale,
  });
}
crossLinkEdges.forEach(function(e) { edgesDS.add(e); });

const network = new vis.Network(document.getElementById('graph'), { nodes: nodesDS, edges: edgesDS }, {
  physics: {
    enabled: true,
    solver: 'forceAtlas2Based',
    forceAtlas2Based: { gravitationalConstant: -80, centralGravity: 0.01, springLength: 110, springConstant: 0.08, damping: 0.4, avoidOverlap: 0.6 },
    stabilization: { iterations: 300, fit: true },
  },
  interaction: { hover: true, tooltipDelay: 150, hideEdgesOnDrag: true, zoomView: true },
  nodes: { shape: 'dot', borderWidth: 2, widthConstraint: { maximum: 150 } },
  edges: { selectionWidth: 3 },
});

network.once('stabilizationIterationsDone', () => { network.setOptions({ physics: { enabled: false } }); });

// Color mode toggle
function setActiveBtn(mode) {
  ['btn-episode', 'btn-type', 'btn-community'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('active', id === 'btn-' + mode);
  });
}
function recolorNodes() {
  RAW_NODES.forEach(n => {
    const c = nodeColor(n);
    nodesDS.update({ id: n.id, color: { background: c, border: c, highlight: { background: '#fff', border: c } } });
  });
  buildLegend();
}
if (IS_MERGED) {
  document.getElementById('btn-episode').addEventListener('click', () => { colorMode = 'episode'; setActiveBtn('episode'); recolorNodes(); });
  document.getElementById('btn-type').addEventListener('click', () => { colorMode = 'type'; setActiveBtn('type'); recolorNodes(); });
  document.getElementById('btn-community').addEventListener('click', () => { colorMode = 'community'; setActiveBtn('community'); recolorNodes(); });
}

// Search
document.getElementById('search').addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase().trim();
  const sr = document.getElementById('search-results');
  sr.innerHTML = '';
  if (!q || q.length < 1) return;
  RAW_NODES.filter(n => n.label.toLowerCase().includes(q) || n.id.toLowerCase().includes(q)).slice(0, 20).forEach(n => {
    const d = document.createElement('div');
    d.className = 'search-item';
    const c = nodeColor(n);
    d.innerHTML = '<span class="search-dot" style="background:' + c + '"></span>' + escapeHtml(n.label);
    d.onclick = () => { network.focus(n.id, { scale: 1.5, animation: true }); network.selectNodes([n.id]); };
    sr.appendChild(d);
  });
});

// Expand neighbors — called by "+N more" button
var _pendingNeighbors = [];
var INITIAL_NEIGHBORS = 15;
function expandNeighbors() {
  var pills = document.getElementById('neighbor-pills');
  for (var i = 0; i < _pendingNeighbors.length; i++) {
    var nb = _pendingNeighbors[i];
    var s = document.createElement('span');
    s.className = 'neighbor';
    s.style.borderLeft = '2px solid ' + nb.nc;
    s.textContent = nb.label;
    (function(id) { s.onclick = function() { network.focus(id, {scale:1.5,animation:true}); }; })(nb.id);
    pills.appendChild(s);
  }
  var btn = document.getElementById('expand-btn');
  if (btn) btn.style.display = 'none';
}

// Node click
network.on('click', (params) => {
  const info = document.getElementById('info-content');
  if (!params.nodes.length) { info.innerHTML = 'Click a node to explore the story.'; return; }
  const nid = params.nodes[0];
  const n = RAW_NODES.find(x => x.id === nid);
  if (!n) return;

  const neighbors = network.getConnectedNodes(nid).map(id => RAW_NODES.find(x => x.id === id)).filter(Boolean);

  let h = '<div class="label">' + escapeHtml(n.label) + '</div>';
  const tc = TYPE_COLORS[n.file_type] || '#BAB0AC';
  h += '<div class="type-badge" style="background:' + tc + '33;color:' + tc + '">' + n.file_type.replace(/_/g, ' ') + '</div>';
  if (n.episode) {
    const ec = EPISODE_COLORS[n.episode] || DEFAULT_EP_COLOR;
    h += '<div class="type-badge" style="background:' + ec + '33;color:' + ec + '">' + n.episode + '</div>';
  }

  const props = n.properties || {};
  for (const [k, v] of Object.entries(props)) {
    if (k === 'character_id') continue;
    if (typeof v === 'string' && v.length > 200) {
      h += '<div class="meta"><b>' + escapeHtml(k) + ':</b> ' + escapeHtml(v.slice(0, 200)) + '…</div>';
    } else {
      h += '<div class="meta"><b>' + escapeHtml(k) + ':</b> ' + escapeHtml(v) + '</div>';
    }
  }

  // Community info
  h += '<div class="meta" style="margin-top:6px"><b>Community:</b> ' + escapeHtml(n.community_name || 'Community ' + n.community) + '</div>';
  if (n.community_cohesion > 0) {
    const cohColor = n.community_cohesion >= 0.3 ? '#59A14F' : n.community_cohesion >= 0.1 ? '#EDC948' : '#E15759';
    h += '<div class="meta"><b>Cohesion:</b> <span style="color:' + cohColor + '">' + n.community_cohesion.toFixed(2) + '</span></div>';
  }
  if (n.is_bridge) h += '<div class="meta" style="color:#F28E2B">Bridge node (connects communities)</div>';
  if (n.is_god) h += '<div class="meta" style="color:#FF9DA7">Hub node (high connectivity)</div>';
  if (n.is_isolated) h += '<div class="meta" style="color:#E15759">Isolated (no intra-community edges)</div>';

  // PageRank info
  var pr = PAGE_RANK_SCORES[n.id];
  if (pr !== undefined && pr > 0) {
    var prColor = pr >= prThreshold ? '#FFD166' : '#888';
    h += '<div class="meta" style="margin-top:4px"><b>PageRank:</b> <span style="color:' + prColor + '">' + pr.toFixed(4) + '</span>';
    if (pr >= prThreshold) h += ' (top 10%)';
    h += '</div>';
  }

  h += '<div class="neighbor-section">';
  h += '<div class="neighbor-header">Connected (' + neighbors.length + ')</div>';
  h += '<div class="neighbors" id="neighbor-pills">';
  neighbors.slice(0, INITIAL_NEIGHBORS).forEach(nb => {
    const nc = nodeColor(nb);

function buildLegend() {

  hidden.clear();
  const legendTitle = document.getElementById('legend-title');

  if (colorMode === 'community') {
    legendTitle.textContent = 'Communities';
    const commGroups = {};
    RAW_NODES.forEach(n => { const c = n.community; commGroups[c] = (commGroups[c] || 0) + 1; });
    Object.entries(commGroups).sort((a, b) => b[1] - a[1]).forEach(([cid, count]) => {
      const color = COMMUNITY_COLORS[Number(cid) % COMMUNITY_COLORS.length];
      const label = RAW_NODES.find(n => n.community === Number(cid))?.community_name || ('Community ' + cid);
      const ca = COMMUNITY_ANALYSIS?.communities?.find(c => c.id === Number(cid));
      const cohesionStr = ca ? (' (cohesion: ' + ca.cohesion.toFixed(2) + ')') : '';
      const d = document.createElement('div');
      d.className = 'legend-item';
      d.innerHTML = '<span class="legend-dot" style="background:' + color + '"></span>' + escapeHtml(label) + cohesionStr + ' <span class="legend-count">' + count + '</span>';
      d.onclick = () => {
        if (hidden.has('comm_' + cid)) { hidden.delete('comm_' + cid); d.classList.remove('dimmed'); }
        else { hidden.add('comm_' + cid); d.classList.add('dimmed'); }
        RAW_NODES.forEach(n => { nodesDS.update({ id: n.id, hidden: hidden.has('comm_' + n.community) }); });
      };
      legend.appendChild(d);
    });
  } else if (colorMode === 'episode') {
    legendTitle.textContent = 'Episodes';
    const epCounts = {};
    RAW_NODES.forEach(n => { const ep = n.episode || 'unknown'; epCounts[ep] = (epCounts[ep] || 0) + 1; });
    Object.entries(epCounts).sort(([a], [b]) => a.localeCompare(b)).forEach(([ep, count]) => {
      const c = EPISODE_COLORS[ep] || DEFAULT_EP_COLOR;
      const d = document.createElement('div');
      d.className = 'legend-item';
      d.innerHTML = '<span class="legend-dot" style="background:' + c + '"></span>' + ep + ' <span class="legend-count">' + count + '</span>';
      d.onclick = () => {
        if (hidden.has(ep)) { hidden.delete(ep); d.classList.remove('dimmed'); }
        else { hidden.add(ep); d.classList.add('dimmed'); }
        RAW_NODES.forEach(n => { nodesDS.update({ id: n.id, hidden: hidden.has(n.episode || 'unknown') }); });
      };
      legend.appendChild(d);
    });
  } else {
    legendTitle.textContent = 'Node Types';
    const tc = {};
    RAW_NODES.forEach(n => { tc[n.file_type] = (tc[n.file_type] || 0) + 1; });
    Object.entries(tc).sort((a, b) => b[1] - a[1]).forEach(([type, count]) => {
      const c = TYPE_COLORS[type] || '#BAB0AC';
      const d = document.createElement('div');
      d.className = 'legend-item';
      d.innerHTML = '<span class="legend-dot" style="background:' + c + '"></span>' + type.replace(/_/g, ' ') + ' <span class="legend-count">' + count + '</span>';
      d.onclick = () => {
        if (hidden.has(type)) { hidden.delete(type); d.classList.remove('dimmed'); }
        else { hidden.add(type); d.classList.add('dimmed'); }
        RAW_NODES.forEach(n => { nodesDS.update({ id: n.id, hidden: hidden.has(n.file_type) }); });
      };
      legend.appendChild(d);
    });
  }
}
